name: amanah_frontend
description: Amanah - Your Islamic Companion
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # HTTP & networking
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # Storage & auth
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Navigation
  go_router: ^13.2.0

  # UI
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Audio
  just_audio: ^0.9.36

  # Islamic features
  flutter_qiblah: ^2.1.2
  hijri: ^3.0.0

  # Graphics
  flutter_svg: ^2.0.10+1

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# App launcher icon config
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#EFF4F1"
  adaptive_icon_foreground: "assets/images/logo.png"
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#EFF4F1"
    theme_color: "#1B5E45"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Uncomment after adding font files to assets/fonts/
  # fonts:
  #   - family: Amiri
  #     fonts:
  #       - asset: assets/fonts/Amiri-Regular.ttf
  #       - asset: assets/fonts/Amiri-Bold.ttf
  #         weight: 700